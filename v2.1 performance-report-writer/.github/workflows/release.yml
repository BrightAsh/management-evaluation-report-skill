# main에 설치용 zip(dist/)이나 버전(package.json)이 바뀌어 올라오면, 같은 버전의 릴리스를 만들거나 zip을 갱신한다.
# README의 '스킬 zip 받기' 링크(releases/latest/download/...)가 이 파일을 가리킨다.
name: release-zip
on:
  push:
    branches: [main]
    paths: ['dist/performance-report-writer.zip', 'package.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 설치용 zip 만들기
        run: python3 tools/build_zip.py
      - name: 릴리스 만들기·갱신
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(python3 -c "import json;print(json.load(open('package.json'))['version'])")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/performance-report-writer.zip --clobber
          else
            gh release create "$TAG" dist/performance-report-writer.zip --target "$GITHUB_SHA" --title "$TAG" --notes-file .github/release_notes.md --latest
          fi
